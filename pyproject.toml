[project]
name = "shortstack"
version = "0.1.0"
description = "AI short-video pipeline (Trending Tech)"
requires-python = ">=3.11"
# Root project pulls every workspace member in as a dep so `uv sync` at the
# repo root installs them all in editable mode. Without these, members get
# resolved transitively only when something else depends on them — and the
# CLI/test suite/render etc. all live in `workers` which nothing else
# depends on, so it'd silently not install. Hit on a fresh Ubuntu setup.
dependencies = [
    "shortstack-api",
    "shortstack-core",
    "shortstack-publishers",
    "shortstack-worker",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/core",
    "packages/publishers",
    "workers",
]

[tool.uv.sources]
shortstack-api = { workspace = true }
shortstack-core = { workspace = true }
shortstack-publishers = { workspace = true }
shortstack-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages", "workers"]
# Use importlib mode so multiple `tests/` packages (one per workspace member)
# don't collide under the default `prepend` import mode.
addopts = "--import-mode=importlib"
