[project]
name = "shortstack-worker"
version = "0.1.0"
description = "ShortStack Celery workers"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4",
    "redis>=5.0",
    "shortstack-core",
    "shortstack-publishers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortstack_worker"]
