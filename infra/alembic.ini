[alembic]
# Paths are CWD-relative by default in alembic. Using %(here)s (the dir of
# this .ini) so 'uv run alembic -c infra/alembic.ini ...' from the repo
# root finds migrations + the source-of-truth models without a 'cd infra'.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../packages/core
sqlalchemy.url = postgresql+psycopg://shortstack:shortstack@localhost:5432/shortstack
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
