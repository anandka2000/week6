[project]
name = "shortstack-core"
version = "0.1.0"
description = "ShortStack core: schemas, prompts, db, storage, cost"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortstack_core"]
