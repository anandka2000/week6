[project]
name = "shortstack-publishers"
version = "0.1.0"
description = "ShortStack publisher interface and platform implementations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "shortstack-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortstack_publishers"]
